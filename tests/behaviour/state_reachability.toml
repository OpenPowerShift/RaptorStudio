note = """
  The wait's full length is `run_length - SimTime` against the BLOCK's
  horizon, and `BlockEnv` is built with `block_horizon`, not the
  model's `run_length` (`kickoff.py:480-485`): that horizon is
  `_FAR_FUTURE` for every termination type, so the wait ends at t=1e9
  h however long the model's own run is. Reaching the cell therefore
  needs a run LONGER than 1e9 h, or the model's `EndSimulation` pops
  first and the wait is simply abandoned -- which is why every shorter
  probe, `Fixed(2e9)` life and all, records nothing at this site at
  all.
"""

