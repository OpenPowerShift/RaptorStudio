[[cell]]
site = "beyond_horizon"
reason = "Switched_Off"
class = "unreachable"
note = """
  Delivery gate, and the gate is structural rather than incidental.
  `Switched_Off` has exactly one sender: `run_cold_logic`'s too-many-
  on branch (`cold_standby.py:673`), which fires it at the block it
  has just demoted with `Too_many_on` -- that is, the block that has
  LOST its cold slot. `_switch_interrupt` refuses unless the target is
  in `FailWait` or `ZeroWait` (`cascade_cold.py:278`) and, first,
  refuses outright when the target handle is the one currently
  executing (`cascade_cold.py:270-272`). The demoted block is always
  the currently-executing one, and always is because of
  `reorder_colds` (`cold_standby.py:181-186`): when a cold link goes
  Up->Down/PM/Done it is moved to the BACK of `node.cold_links`, and
  `run_cold_logic`'s enough-paths pass keeps the FIRST `runs_required`
  UP links in that order (`cold_standby.py:610-624`). So the block
  whose link most recently came back UP -- the block whose own repair-
  completion cascade is running the survey -- is always last in the
  order and therefore always the one demoted. Every survey the port
  runs at SimTime>0 is reached through `_Cascade.apply_cold_logic`
  from a block transition (`cascade_cold.py:23-59`), so the executing
  handle is the trigger's, never another block's. Measured over a
  sweep of 165 cold shapes -- two to four peers, `k` and `k_star` in
  {1,2}, eight cold-priority orderings, lives mixing ordinary and
  `Fixed(2e9)`, repairs 5/10/25 h -- of 490 `Switched_Off` attempts,
  490 named the currently-executing handle and 0 named a block parked
  in a wait. The cell would need a demotion driven by something other
  than the demoted block's own turn, which no `reconfigure_node` /
  `CheckColds` path the port has produces.
"""

