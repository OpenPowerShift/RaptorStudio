# The behavioural denominator, classified.
#
# Read by tests/behaviour/test_b_behaviour_coverage.py, which is the gate
# that decides whether the 610 MB of legacy event-log captures under
# tests/golden/ can stop being the oracle. Every one of the 318 distinct
# `(object_type, from -> to)` transitions real Raptor performed is listed
# below, exactly once, with exactly one class:
#
#   pinned      asserted today by an `assert_timeline` literal somewhere in
#               tests/behaviour/. The gate parses those literals with `ast`
#               and fails if a `pinned` claim has no literal behind it, so
#               this class cannot rot into a wish. As of the S11 rung of the
#               ladder every `pinned` row is asserted by the spine's own
#               literals in `test_b_ladder.py`.
#   planned     reachable, and expected to be pinned by a named rung of the
#               catalogue (the rung test files).
#               `reference` names the rung and the test file that owns it;
#               the gate rejects a reference to a file that is not in that
#               catalogue.
#   unreachable not reachable in our engine. Needs a reason, and the honest
#               answer is that there are none: the ladder's 4,180 runs
#               reproduce these logs, so every one of the 274 live
#               transitions is performed by the port somewhere. Claiming one
#               unreachable would be a claim about a test nobody has written
#               yet, not about the engine. The class exists for P5.
#   artefact    a row that is not a transition at all. Needs a reason.
#
# The classification rules, so a reviewer can check any entry without
# reading all 318:
#
#   1. Anything with `StessLevel` on either side is an artefact -- 18 rows.
#      Raptor writes its misspelt `StressLevel` in the state column for a
#      `CombStress=` re-report line; there is no such state in our model.
#   2. Anything whose `from_state` is `--` is a start condition -- 26 rows.
#      `--` is Raptor's null in the state column and `from` is `--` only
#      because the object had no earlier row in the capture, so the row
#      states an initial state rather than a change. The corpus
#      measurement names `Block -- -> Repairing` (5 occurrences) as the
#      visible instance; the same argument covers the other 25, and
#      exempting only the alarming one would be indefensible. One of the 26
#      is not even a state: `System -- -> --` is the `Begin_Run_N` /
#      `Simulation_Terminate` marker row.
#   3. Anything already asserted by a committed literal is `pinned`, with
#      `reference` naming the constant that asserts it. This one is
#      *measured*, not claimed: the generator ran the gate's own `ast` scan
#      over tests/behaviour/ and took what it found. Re-measured when the
#      ladder reached S7 and again at S11, which is how the 16 -> 35 -> 43
#      steps below happened.
#   4. Everything else is `planned`, owned by the mechanism that *produces
#      the destination state*: Bad/Degraded/Good -> the cascade (S2
#      test_b_cascade.py), Idle -> a dependency (S6
#      test_b_dependency.py), NodePM -> a node PM (S4 test_b_pm.py),
#      Standby/Switch_Failed -> cold standby (S8), Sparing / the system's
#      Out_of_spares -> a pool (S7 test_b_spare_pool.py), Resources -> the
#      resource queue (S3 test_b_resource_queue.py), pmHold / pmReqDefer /
#      RepHold -> PM deferral (S4 test_b_pm_defer.py), PM / PM_complete /
#      PM_is_due -> scheduled maintenance (S4 test_b_pm.py), Cut / Linked ->
#      the active status (S9 test_b_cut_linked.py), Mission / Phase_change /
#      Mission_success / Mission_failure -> phases (S9 test_b_phases.py),
#      Green / Yellow / Red -> system status (S2 test_b_system_status.py),
#      the End_* LDT states -> test_b_ldt.py (S1), and the rest of the block
#      life -> test_b_block_life.py (S1).
#
# Totals: 318 = 43 pinned + 231 planned + 0 unreachable
# + 44 artefact (18 StessLevel + 26 start conditions).
# The ratchet below is the gate's progress counter; raise `pinned` in the
# same commit that adds the literal, and never lower either number to make
# a run green.
#
# HOW TO PROMOTE AN ENTRY: write the test that pins the transition, then
# change `class = "planned"` to `class = "pinned"` and fill in `reference`.
# The gate fails until both are done, which is the point -- a test that
# exists and a claim that is recorded are the same commit.

[ratchet]
# Transitions classified in this file. May only rise; falling below it means
# a classification was deleted rather than a corpus row going away.
classified = 324
# Corpus transitions asserted by a committed `assert_timeline` literal in
# tests/behaviour/. 16 after the S1-S3 spine; 35 after S4-S7, whose four
# rungs added 19 -- the PM sequence, the trigger, the dependence, the pool;
# 43 after S8-S11, whose four rungs added 8 -- the two cold-standby
# transitions (`Good -> Standby`, `Standby -> Good`), the standby block's
# `Standby -> Done`, the event's `Armed -> Success` and `Success -> Armed`,
# and three `System` rows that only a phased or mission-bearing run produces
# (`Mission -> Red`, `Phase_change -> Mission_failure`, `Red -> Red`).
pinned = 268


