# --- System -- the status rollup and the phase rows (36). ---
reference = "test_b_final_rows.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "--"
class = "artefact"
reason = """
Not a state at all: Raptor's run-marker rows carry `--` in the state column --
  one `System Begin_Run_N -- --` per run and one `System Simulation_Terminate
  -- --` per run (4,180 of the latter in the corpus). There is no system
  status to change, so this row is a separator, not a transition. It is also
  why the extractor must not reset state at a run boundary: Raptor does not
  re-announce the objects at a run start.
"""
reference = "test_b_cascade.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "Mission"
class = "artefact"
reason = """
Start condition: the system's first row is the start of mission 1
  (`detail=Began_a_mission`), which for a phased model is t=0
  (test_b_phases.py, S9).
"""
reference = "test_b_cascade.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "Mission_failure"
class = "artefact"
reason = """
Start condition: the model's first row, a mission that failed with no other
  row before it (test_b_phases.py, S9).
"""
reference = "test_b_cascade.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "Mission_success"
class = "artefact"
reason = """
Start condition: the model's first row, a mission that completed successfully
  with no other row before it (test_b_phases.py, S9).
"""
reference = "test_b_final_rows.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "Out_of_spares"
class = "artefact"
reason = """
Start condition: the system's first row, a permanent-down rollup
  (`detail=System_change`) at t=0 (test_b_spare_pool.py, S7).
"""
reference = "test_b_cascade.py"
[[transition]]
object = "System"
from_state = "--"
to_state = "Phase_change"
class = "artefact"
reason = """
Start condition: the model's first row is a phase change
  (`detail=Begin_phase_...`), i.e. the first phase's end barrier
  (test_b_phases.py, S9).
"""
reference = "test_b_cascade.py"
[[transition]]
