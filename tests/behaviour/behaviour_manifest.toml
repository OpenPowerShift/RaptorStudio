from_state = "--"
to_state = "NodePM"
class = "artefact"
reason = """
Start condition: the hierarchy's first status rollup is NodePM, from a node PM
  at t=0 (test_b_hierarchy.py, S2).
"""
reference = "test_b_trans_graph.py"
[[transition]]
object = "Hier"
from_state = "Bad"
to_state = "Bad"
class = "unreachable"
reference = "S2: test_b_hierarchy.py"
reason = """A hierarchy's status row is written in exactly one place, and neither
route into it is open to a marker whose status has not changed.
`determine_node_status` is the only writer of a `Hier` row
(`nodes.py:301-314`) and it is reached only from `reconfigure_node`,
which re-aggregates only when `link_status_changed or in_path == 0`
(`nodes.py:455-456`). Every `reconfigure_node` call site passes a
nonzero `in_path` except two. `kickoff.py:452` is guarded by
`node.good_paths > len(node.in_paths_array)`, which a marker cannot
satisfy: its `k` column is `-1`, `typed.py:260-261` maps that to
`good_paths=1`, and `builder.validate` gives a marker exactly one
incoming link, so the guard reads `1 > 1`. `cascade_cold.py:90` is
`RunColdLogic`'s `higherCold` arm, which needs the marker itself to be
a cold node -- and `run_cold_logic`'s own resurvey then raises
`ValueError("Error in node status logic (cold logic)!")` on a
single-link cold type-5 marker (`cold_standby.py:755-816`), so no
runnable model reaches it. The route that gives *ordinary* nodes their
`X -> X` rows is closed as well: `cascade_phase.apply_node` handles
`type_node == 5` by calling `_cascade_node(node, node.status, ...)`
rather than `reconfigure_node` (`cascade_phase.py:199-213`), and
`change_node_state` writes no log line at all (`nodes.py:632-700`).
What is left is a re-aggregation after the marker's single incoming
link changed status, and with one link and `good_paths = 1` that map is
injective: `UP` -> `Good`, `STANDBY` -> `Standby`, `IDLE` -> `Idle`,
`PM` -> `NodePM`, `DOWN` or `DONE` -> `Bad`. The only collision,
`DOWN` against `DONE`, needs `LinkStatus.DONE`, which is written in
exactly one place -- `_switch_failed`, acting on a node's own cold link
(`cold_standby.py:244`) -- and a marker cannot be a cold node. So a
marker never logs the same status twice, which is also why the corpus's
seventeen `Hier` rows are the twelve off-diagonal pairs plus three
first-appearance rows, and not one `X -> X`."""

