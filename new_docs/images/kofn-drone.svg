<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="320" fill="#fffdf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b3a55">Vote (4 of 6): lose two motors, keep flying</text>
  <!-- battery -->
  <circle cx="70" cy="160" r="16" fill="#27ae60"/>
  <text x="70" y="166" text-anchor="middle" font-size="12" fill="#fff">S</text>
  <g stroke="#2b3a55" stroke-width="2" fill="#eaf2f8">
    <rect x="120" y="137" width="90" height="46" rx="6"/>
  </g>
  <text x="165" y="165" text-anchor="middle" font-size="13" fill="#2b3a55">Battery</text>
  <!-- join -->
  <circle cx="260" cy="160" r="10" fill="#fdebd0" stroke="#b9770e" stroke-width="2"/>
  <!-- motors -->
  <g stroke="#2b3a55" stroke-width="2" fill="#eaf2f8">
    <rect x="330" y="62" width="92" height="38" rx="6"/>
    <rect x="330" y="112" width="92" height="38" rx="6"/>
    <rect x="330" y="162" width="92" height="38" rx="6"/>
    <rect x="330" y="212" width="92" height="38" rx="6"/>
    <rect x="330" y="262" width="92" height="38" rx="6"/>
    <rect x="440" y="212" width="92" height="38" rx="6"/>
  </g>
  <text x="376" y="86" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_1</text>
  <text x="376" y="136" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_2</text>
  <text x="376" y="186" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_3</text>
  <text x="376" y="236" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_4</text>
  <text x="376" y="286" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_5</text>
  <text x="486" y="236" text-anchor="middle" font-size="12" fill="#2b3a55">Motor_6</text>
  <!-- vote node -->
  <rect x="530" y="140" width="130" height="44" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="595" y="160" text-anchor="middle" font-size="13" fill="#145a32">Motors_need_4</text>
  <text x="595" y="176" text-anchor="middle" font-size="11" fill="#145a32">need 4 of 6</text>
  <!-- FC + end -->
  <g stroke="#2b3a55" stroke-width="2" fill="#eaf2f8">
    <rect x="580" y="240" width="110" height="40" rx="6"/>
  </g>
  <text x="635" y="264" text-anchor="middle" font-size="12" fill="#2b3a55">Flight_Controller</text>
  <!-- links battery->join->motors->vote->FC -->
  <g stroke="#2b3a55" stroke-width="1.6">
    <line x1="86" y1="160" x2="116" y2="160"/>
    <line x1="210" y1="160" x2="250" y2="160"/>
    <line x1="268" y1="156" x2="285" y2="81"/><line x1="300" y1="81" x2="326" y2="81"/>
    <line x1="268" y1="158" x2="290" y2="131"/><line x1="300" y1="131" x2="326" y2="131"/>
    <line x1="270" y1="160" x2="326" y2="181"/>
    <line x1="270" y1="162" x2="290" y2="231"/><line x1="300" y1="231" x2="326" y2="231"/>
    <line x1="268" y1="164" x2="285" y2="281"/><line x1="300" y1="281" x2="326" y2="281"/>
    <line x1="270" y1="164" x2="440" y2="230"/>
    <line x1="422" y1="81" x2="500" y2="145"/><line x1="422" y1="131" x2="505" y2="150"/>
    <line x1="422" y1="181" x2="520" y2="162"/><line x1="422" y1="231" x2="526" y2="170"/>
    <line x1="422" y1="281" x2="530" y2="178"/><line x1="532" y1="231" x2="545" y2="184"/>
    <line x1="600" y1="184" x2="620" y2="236"/>
  </g>
  <text x="360" y="315" text-anchor="middle" font-size="14" fill="#145a32">Down only when a third motor dies.</text>
</svg>
