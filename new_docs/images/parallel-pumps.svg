<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#fffdf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b3a55">Parallel (1 of 2): the survivor keeps coffee flowing</text>
  <!-- start -->
  <circle cx="80" cy="150" r="18" fill="#27ae60"/>
  <text x="80" y="156" text-anchor="middle" font-size="13" fill="#fff">S</text>
  <!-- split node -->
  <rect x="170" y="128" width="70" height="44" rx="6" fill="#fdebd0" stroke="#b9770e" stroke-width="2"/>
  <text x="205" y="155" text-anchor="middle" font-size="13" fill="#7e5109">split</text>
  <!-- pumps -->
  <g stroke="#2b3a55" stroke-width="2" fill="#eaf2f8">
    <rect x="330" y="80" width="100" height="46" rx="6"/>
    <rect x="330" y="180" width="100" height="46" rx="6"/>
  </g>
  <text x="380" y="108" text-anchor="middle" font-size="14" fill="#2b3a55">Pump_A</text>
  <text x="380" y="208" text-anchor="middle" font-size="14" fill="#2b3a55">Pump_B</text>
  <!-- join node -->
  <rect x="500" y="128" width="120" height="44" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="560" y="148" text-anchor="middle" font-size="13" fill="#145a32">Either_pump</text>
  <text x="560" y="164" text-anchor="middle" font-size="11" fill="#145a32">need 1 of 2</text>
  <!-- boiler -->
  <rect x="590" y="230" width="100" height="42" rx="6" fill="#eaf2f8" stroke="#2b3a55" stroke-width="2"/>
  <text x="640" y="256" text-anchor="middle" font-size="14" fill="#2b3a55">Boiler</text>
  <!-- links -->
  <g stroke="#2b3a55" stroke-width="2">
    <line x1="98" y1="150" x2="166" y2="150"/>
    <line x1="240" y1="140" x2="285" y2="103"/><line x1="240" y1="160" x2="285" y2="203"/>
    <line x1="285" y1="103" x2="326" y2="103"/><line x1="285" y1="203" x2="326" y2="203"/>
    <line x1="430" y1="103" x2="496" y2="143"/><line x1="430" y1="203" x2="496" y2="160"/>
    <line x1="620" y1="172" x2="640" y2="226"/>
  </g>
  <polygon points="166,145 176,150 166,155" fill="#2b3a55"/>
  <polygon points="322,99 332,104 323,109" fill="#2b3a55"/>
  <polygon points="322,199 332,204 323,209" fill="#2b3a55"/>
  <text x="360" y="285" text-anchor="middle" font-size="14" fill="#145a32">System lives while at least one pump lives.</text>
</svg>
