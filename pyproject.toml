[tool.mypy]
python_version = "3.12"
files = ["raptor"]
# PySide6 ships its own stubs; everything else third-party is
# untyped -- don't drown in import errors.
ignore_missing_imports = true
# Incremental adoption baseline: the codebase long predates the
# checker -- flag type errors, but don't demand annotations.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license` expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["raptor*"]

# The window icon and the splash logo are read from the package at start-up.
[tool.setuptools.package-data]
"raptor.gui.resources" = ["*.png", "examples/*.png"]
"raptor.mcp" = ["output_schemas.json"]

# The rendered help docs, the book chapters and the tutorial models are part
# of the app (in-app Help viewer, opsmodel:// buttons, the MCP server's
# read_doc/search_docs and examples). Data files land in the install scheme's
# data directory (sys.prefix, or the user base for `pip install --user`);
# raptor/bundled.py finds them there or in a checkout. The PyInstaller
# installers bundle the same trees from the repo checkout.
[tool.setuptools.data-files]
"docs" = ["docs/manual.html", "docs/formulas.html", "docs/ops_asciidoctor.css", "docs/RBDS_FORMAT.md",
         "docs/KEYBOARD_SHORTCUTS.md", "docs/IEC61078.md", "docs/MCP.md"]
# MathJax (Apache-2.0, see its LICENSE) typesets the formulas page offline: the page loads it from js/.
"docs/js" = ["docs/js/mathjax-config.js"]
"docs/js/mathjax" = ["docs/js/mathjax/startup.js", "docs/js/mathjax/core.js", "docs/js/mathjax/LICENSE"]
"docs/js/mathjax/input" = ["docs/js/mathjax/input/asciimath.js"]
"docs/js/mathjax/output" = ["docs/js/mathjax/output/chtml.js"]
"docs/js/mathjax/output/chtml/fonts" = ["docs/js/mathjax/output/chtml/fonts/tex.js"]
"docs/js/mathjax/output/chtml/fonts/woff-v2" = ["docs/js/mathjax/output/chtml/fonts/woff-v2/*.woff"]
"new_docs" = ["new_docs/book.html", "new_docs/book.adoc", "new_docs/ops_asciidoctor.css"]
# Sources for the MCP server's search_docs / read_doc / raptor://docs/*.
"new_docs/chapters" = ["new_docs/chapters/*.adoc"]
"new_docs/images" = ["new_docs/images/*"]
"new_docs/models" = ["new_docs/models/*"]
# Man pages and shell completions for the `raptor` command (generated from
# the parser by `python -m raptor.cli.manpages docs/man`; a test fails if the
# committed copies are stale).
"share/man/man1" = ["docs/man/*.1"]
"share/man/man5" = ["docs/man/*.5"]
"share/man/man7" = ["docs/man/*.7"]
"share/bash-completion/completions" = ["docs/completions/raptor"]
"share/zsh/site-functions" = ["docs/completions/_raptor"]
"share/fish/vendor_completions.d" = ["docs/completions/raptor.fish"]
