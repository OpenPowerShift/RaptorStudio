name: GUI coverage

# Branch coverage of raptor/gui, measured in CI because a traced local run of the
# GUI tests takes over an hour. Used as the safety net before splitting the large
# GUI modules (main_window, diagram, results, inspector, data_tables).
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to measure (raptor.gui, or raptor for everything)"
        default: raptor.gui
      markers:
        description: "pytest -m expression choosing the tests"
        default: "gui and not slow and not fidelity and not long"
  push:
    branches: [refactor/gui-split]

concurrency:
  group: gui-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-qt
        with:
          python-version: "3.13"
          extras: "dev,mcp"
      - name: GUI tests under coverage
        env:
          QT_QPA_PLATFORM: offscreen
          RAPTOR_TEST_SHARD: ${{ matrix.shard }}/4
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
          PACKAGE: ${{ inputs.package || 'raptor.gui' }}
          MARKERS: ${{ inputs.markers || 'gui and not slow and not fidelity and not long' }}
        run: >-
          pytest -q -n auto -p no:cacheprovider -m "$MARKERS"
          --cov="$PACKAGE" --cov-branch --cov-report=
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-cov-${{ matrix.shard }}
          path: .coverage.shard*
          include-hidden-files: true

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-qt
        with:
          python-version: "3.13"
          extras: "dev"
      - uses: actions/download-artifact@v8
        with:
          pattern: gui-cov-*
          merge-multiple: true
      - name: Combine and report
        env:
          PACKAGE: ${{ inputs.package || 'raptor.gui' }}
        run: |
          include="$(echo "$PACKAGE" | tr . /)/*"
          coverage combine .coverage.shard*
          coverage report --include="$include" --sort=cover | tee gui-coverage.txt
          coverage json --include="$include" -o gui-coverage.json
          coverage html --include="$include" -d gui-coverage-html
      - uses: actions/upload-artifact@v7
        with:
          name: gui-coverage
          path: |
            gui-coverage.txt
            gui-coverage.json
            gui-coverage-html
