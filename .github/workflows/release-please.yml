name: Release Please

# Maintains a Release PR from conventional commits: bumps
# pyproject.toml's version, keeps CHANGELOG.md, and on merge cuts the
# vX.Y.Z tag + GitHub Release that trigger release.yml (PyPI publish +
# installers).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A release made with the default GITHUB_TOKEN does not trigger
          # release.yml, so set RELEASE_PLEASE_TOKEN (a fine-grained PAT or
          # GitHub App token) for releases to publish automatically.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
